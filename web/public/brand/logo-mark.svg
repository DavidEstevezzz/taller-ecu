<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img"
     aria-labelledby="jm-mark-title" fill="none">
  <title id="jm-mark-title">JM Repro Cars</title>

  <!-- Chasis: silueta de conector de centralita, con la esquina achaflanada -->
  <path d="M4 9.5A2.5 2.5 0 0 1 6.5 7h29.9c.66 0 1.3.26 1.77.73l5.1 5.1c.47.47.73 1.11.73 1.77V38.5A2.5 2.5 0 0 1 41.5 41h-35A2.5 2.5 0 0 1 4 38.5Z"
        stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Pines del conector, arriba -->
  <path d="M13 7V3.5M20 7V3.5M27 7V3.5" stroke="currentColor"
        stroke-width="2.4" stroke-linecap="round"/>

  <!-- Monograma JM: la J desciende y gira; la M se levanta desde su curva -->
  <path d="M17.5 16.5v9.2a4.3 4.3 0 0 1-4.3 4.3h0a4.3 4.3 0 0 1-4.2-3.4"
        stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
  <path d="M21.5 31V17.6l6.2 7.4 6.2-7.4V31"
        stroke="currentColor" stroke-width="3" stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Pista de circuito: sale de la M, baja y termina en el pad de contacto -->
  <path d="M34 34.5h4.2" stroke="var(--brand-trace, #C25A2C)"
        stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="12" cy="34.5" r="2" fill="var(--brand-trace, #C25A2C)"/>
  <path d="M14.6 34.5h14.8" stroke="var(--brand-trace, #C25A2C)"
        stroke-width="2.4" stroke-linecap="round"/>
</svg>
